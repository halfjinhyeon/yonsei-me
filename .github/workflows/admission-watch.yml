# 입학처 변경 감지 — 우리가 옮겨 적은 입학 정보가 낡지 않았는지 주 1회 확인한다.
#
# 왜 있는가
#   `content/admission-guide.json` 의 입학 캘린더는 입학처 페이지를 사람이 옮겨 적은 것이다.
#   원본이 바뀌어도 우리는 알 길이 없어서, 변한 것을 찾아 **알리기만** 한다.
#   반영은 사람이 한다(automation-plan.md 2절 2 — 입학 정보 자동 반영 금지).
#
# 알리는 길이 두 갈래다 (감시 스크립트의 `--patch` 사본이 원본과 바이트 동일이냐로 갈린다)
#   ① 캘린더가 바뀐 주 → **PR**. 봇 브랜치 `bot/admission-<YYYY-MM-DD>` 에 갱신본을 커밋하고
#      리포트를 본문으로 PR 을 연다. 사람은 diff 를 읽고 머지만 한다 — 자동 머지는 없다.
#      빈 `en` 은 DeepL(`DEEPL_API_KEY`)이 채운다. 키가 없으면 `""` 로 두고 리포트에 적는다.
#   ② 공지·PDF 만 바뀐 주(캘린더는 그대로) → 예전처럼 **이슈**. 고칠 파일이 없어 PR 이 무의미하다.
#
# 신호 3종 (전부 EUC-KR 서버 렌더 HTML, GET 만)
#   S1 입학 캘린더  counsel/calendar.asp?s_year=<YYYY>  ← 우리 캘린더의 원본
#   S2 모집요강 PDF {rolling,regular,transfer}/guide.asp  파일명이 바뀌면 새 요강 공표
#   S3 공지 목록    {rolling,regular,transfer}/notice.asp 제목·작성일(조회수는 버린다)
#
# 스냅샷 브랜치 `bot/admission-watch`
#   "직전에 무엇이었는지"를 어딘가 남겨야 변경을 알 수 있다. main 을 더럽히지 않으려고
#   봇 전용 orphan 브랜치에 `snapshots/*.json` 과 `state.json` 만 둔다(수십 KB). 이 워크플로가
#   처음 돌 때 브랜치가 없으므로, 체크아웃 실패를 정상 경로로 보고 빈 orphan 으로 시작한다.
#
# 손으로 돌려 볼 때
#   workflow_dispatch 의 dry_run 기본값이 true 라, 이슈도 PR 도 만들지 않고 스냅샷도 밀지 않는다
#   (스크립트에도 `--dry-run` 이 그대로 전달돼 스냅샷을 쓰지 않는다). 리포트는 step summary 에 실리고,
#   PR 로 갔을 내용은 "패치 미리보기" 스텝이 `diff -u` 로 보여 준다 — 커밋도 푸시도 하지 않는다.
#
# ⚠️ 함정
#   - 감시 스크립트의 종료 코드가 **0/10/1 세 갈래**다(변경 없음 / 변경 있음 / 수집 실패).
#     `tee` 파이프가 코드를 삼키지 않게 `set -o pipefail` + `${PIPESTATUS[0]}` 로 잡아 출력에 남긴다.
#   - boolean 입력은 workflow_dispatch 에서만 진짜 boolean 이고 schedule 실행에서는 null 이다.
#     `inputs.dry_run == true` 는 스케줄에서 자연히 false 가 된다 — 스케줄은 언제나 실제 반영.
#   - 스냅샷 디렉터리에서만 `git add -A` 를 쓴다. 봇 브랜치 전용이라 다른 파일이 섞일 수 없다.
#     본 저장소 쪽에서는 **`content/admission-guide.json` 한 파일만** 스테이징한다(러너 워크스페이스
#     한정 — 사람의 작업 트리에서는 이 워크플로가 아무것도 하지 않는다).
#   - **저장소 설정이 필요하다**: Settings → Actions → General → Workflow permissions 의
#     "Allow GitHub Actions to create and approve pull requests" 를 켜지 않으면 `gh pr create` 가
#     `GitHub Actions is not permitted to create or approve pull requests` 로 죽는다.
#     브랜치 푸시(`contents: write`)까지는 되므로 **커밋만 남고 PR 이 없는** 모양이 된다.
#   - PR 은 이슈와 달리 "같은 제목이면 댓글" 같은 합류가 없다. 같은 날 두 번 돌면 브랜치가 이미
#     있으므로 **커밋만 얹고** 열린 PR 이 있으면 새로 만들지 않는다(`gh pr list --head`).
#   - PR 본문도 이슈와 같은 65,536자 상한을 받는다 — 리포트가 길면 잘라 싣고 전체는 job summary 로.
#   - `DEEPL_API_KEY` 시크릿이 없으면 빈 문자열이 들어가고, 감시기는 번역을 건너뛰고 `en: ""` 로
#     둔 뒤 리포트에 "영문 미번역 N건" 을 적는다. **번역 실패가 PR 을 막지는 않는다.**
name: 입학처 변경 감지

on:
  schedule:
    # 매주 월요일 09:00 KST (= 00:00 UTC). 입학처 공지는 평일에 올라오고, 주 1회면
    # 사람이 옮겨 적기까지의 지연으로 충분하다.
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '이슈·스냅샷 없이 summary 에만'
        type: boolean
        default: true
      years:
        description: "대상 학년도 (예: '2026,2027' — 비우면 올해와 내년)"
        type: string
        required: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 최소 권한: 코드·봇 브랜치 쓰기(contents: write) + 이슈 쓰기 + PR 쓰기.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      # 손으로 돌린 dispatch 에서 dry_run=true 일 때만 참. 스케줄 실행은 언제나 실제 반영.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
      # 없으면 빈 문자열 — 감시기가 "키 없음"으로 보고 번역을 건너뛴다(en 은 "" 로 남는다).
      DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      # 직전 스냅샷. 브랜치가 아직 없으면 이 스텝은 실패하는데, 그게 첫 실행의 정상 경로다.
      - name: 스냅샷 브랜치 체크아웃
        id: snapshots
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: bot/admission-watch
          path: .admission-snapshots
          fetch-depth: 1

      - name: 스냅샷 브랜치가 없으면 빈 브랜치로 시작
        if: steps.snapshots.outcome != 'success'
        run: |
          set -euo pipefail
          echo "::notice::bot/admission-watch 가 없다 — 빈 orphan 브랜치로 시작한다(첫 실행)."
          rm -rf .admission-snapshots
          mkdir -p .admission-snapshots
          git init -q .admission-snapshots
          git -C .admission-snapshots checkout -q --orphan bot/admission-watch
          # 체크아웃 성공 경로에서는 actions/checkout 이 origin 과 인증(extraheader)을 심어 준다.
          # 이 경로에는 없으니 토큰을 담은 URL 로 origin 을 만든다 — 푸시 스텝을 한 가지로 유지한다.
          git -C .admission-snapshots remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # npm ci 는 하지 않는다 — tools/automation 은 의존성 0(Node 내장 fetch·EUC-KR 디코더).

      - name: 입학처 감시
        id: watch
        env:
          YEARS: ${{ inputs.years }}
        run: |
          set -o pipefail   # tee 가 감시기의 종료 코드를 삼키지 않도록 — 첫 줄이어야 한다
          ARGS=""
          if [ -n "${YEARS:-}" ]; then ARGS="$ARGS --years $YEARS"; fi
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          set +e
          # --patch 사본은 워크스페이스에만 만든다(원본은 건드리지 않는다). PR 스텝이 이것을 얹는다.
          node tools/automation/admission-watch.mjs \
            --snapshots .admission-snapshots \
            --report report.md \
            --compare-content \
            --patch content/admission-guide.json.new \
            --translate --rollover $ARGS 2>&1 | tee watch.log
          CODE=${PIPESTATUS[0]}
          set -e
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "감시기 종료 코드: $CODE (0 변경 없음 · 10 변경 있음 · 1 수집 실패)"
          # 패치 사본이 원본과 **바이트 동일**이냐가 PR 이냐 이슈냐를 가른다.
          # changed=캘린더가 바뀌었다(PR) · same=공지·PDF 만(이슈) · none=패치 자체가 실패(이슈로 낮춤)
          if [ ! -f content/admission-guide.json.new ]; then PATCH=none
          elif cmp -s content/admission-guide.json content/admission-guide.json.new; then PATCH=same
          else PATCH=changed
          fi
          echo "patch=$PATCH" >> "$GITHUB_OUTPUT"
          echo "패치 사본: $PATCH (changed 일 때만 PR 을 연다)"

      # 다음 실행의 기준선. 이 디렉터리는 봇 브랜치 전용이라 -A 로 담아도 섞일 것이 없다.
      - name: 스냅샷 커밋·푸시
        if: steps.watch.outputs.code == '10' && env.DRY_RUN != 'true'
        working-directory: .admission-snapshots
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo '스냅샷 내용이 그대로다 — 커밋할 것이 없다.'
          else
            git commit -q -m "snapshot $(TZ=Asia/Seoul date +%Y-%m-%d)"
            git push origin HEAD:bot/admission-watch
          fi

      # 캘린더가 실제로 바뀐 주에만. 리포트가 그대로 PR 본문이 된다 — 사람은 diff 를 읽고 머지만 한다.
      - name: 패치 PR
        if: steps.watch.outputs.code == '10' && steps.watch.outputs.patch == 'changed' && env.DRY_RUN != 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          DATE=$(TZ=Asia/Seoul date +%Y-%m-%d)
          BRANCH="bot/admission-$DATE"
          TITLE="[자동] 입학 캘린더 갱신 ($DATE)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # 같은 날 두 번 돌면 브랜치가 이미 있다 — 새로 만들지 말고 그 위에 커밋만 얹는다.
          # (패치 사본은 untracked 라 체크아웃을 넘어 살아남는다.)
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "브랜치 $BRANCH 가 이미 있다 — 그 위에 얹는다."
            git fetch --depth=1 origin "$BRANCH"
            git checkout -B "$BRANCH" FETCH_HEAD
          else
            git checkout -B "$BRANCH"
          fi
          mv content/admission-guide.json.new content/admission-guide.json
          git add content/admission-guide.json   # 이 파일 하나만. -A 는 쓰지 않는다.
          if git diff --cached --quiet; then
            echo '브랜치가 이미 같은 내용이다 — 커밋할 것이 없다.'
          else
            git commit -q -m "chore(content): 입학 캘린더 자동 갱신 ($DATE)"
            git push origin "HEAD:$BRANCH"
          fi
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "이미 열린 PR 이 있다 — 커밋만 얹었다."
            exit 0
          fi
          # PR 본문도 이슈와 같은 65,536자 상한을 받는다.
          node -e "
            const fs = require('node:fs');
            const cap = 60000;
            const s = fs.readFileSync('report.md', 'utf8');
            const tail = '\n\n…(리포트가 길어 잘랐다. 전체는 이 실행의 job summary 를 볼 것: ' + process.env.RUN_URL + ')\n';
            fs.writeFileSync('pr-body.md', s.length > cap ? s.slice(0, cap) + tail : s, 'utf8');
          "
          # 라벨이 없으면 만든다(--force 는 있을 때 색·설명만 갱신하고 성공한다) — issue.mjs 와 같은 관례.
          gh label create automation --color 0057A8 --description '자동화 워크플로가 만든 이슈' --force \
            || echo "::warning::라벨 'automation' 보장 실패 — 라벨 없이 PR 을 연다."
          gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file pr-body.md --label automation \
            || gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file pr-body.md

      # dry-run 은 PR 을 만들지 않는다 — 무엇을 커밋할 뻔했는지 diff 로만 보여 준다.
      - name: 패치 미리보기 (dry-run)
        if: env.DRY_RUN == 'true' && steps.watch.outputs.code != '1'
        env:
          PATCH_STATE: ${{ steps.watch.outputs.patch }}
        run: |
          set -o pipefail
          DATE=$(TZ=Asia/Seoul date +%Y-%m-%d)
          {
            echo '## 패치 미리보기 (dry-run — 커밋도 PR 도 하지 않았다)'
            echo
            case "$PATCH_STATE" in
              changed) echo "실제 실행이었다면 브랜치 \`bot/admission-$DATE\` 에 커밋하고 **PR 을 열었을 것**이다." ;;
              same)    echo '패치 사본이 원본과 **바이트 동일**이다 — 캘린더는 그대로다. 실제 실행이었다면 **변경 이슈** 경로로 갔을 것이다.' ;;
              *)       echo '패치 사본이 없다 — `--patch` 가 실패했다. 리포트의 "패치 요약" 절을 볼 것.' ;;
            esac
            echo
            echo '```diff'
            diff -u content/admission-guide.json content/admission-guide.json.new || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 캘린더가 그대로인 주(공지·PDF 만 변경) — 고칠 파일이 없으니 예전처럼 이슈로 알린다.
      # 패치가 실패한(none) 주에도 이리로 온다: 알림을 통째로 잃는 것보다 낫다.
      - name: 변경 이슈
        if: steps.watch.outputs.code == '10' && steps.watch.outputs.patch != 'changed'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -o pipefail
          # 이슈 본문은 65,536자 제한이 있다. 리포트가 길면 잘라 내고 전체는 job summary 로 넘긴다.
          node -e "
            const fs = require('node:fs');
            const cap = 60000;
            const s = fs.readFileSync('report.md', 'utf8');
            const tail = '\n\n…(리포트가 길어 잘랐다. 전체는 이 실행의 job summary 를 볼 것: ' + process.env.RUN_URL + ')\n';
            fs.writeFileSync('issue-body.md', s.length > cap ? s.slice(0, cap) + tail : s, 'utf8');
          "
          TITLE="[자동] 입학처 변경 감지 ($(TZ=Asia/Seoul date +%Y-%m-%d))"
          if [ "$DRY_RUN" = "true" ]; then
            node tools/automation/issue.mjs --title "$TITLE" --body-file issue-body.md --label automation --dry-run
          else
            node tools/automation/issue.mjs --title "$TITLE" --body-file issue-body.md --label automation
          fi

      - name: 감시 실패 이슈
        if: steps.watch.outputs.code == '1'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -o pipefail
          {
            echo '입학처 변경 감지가 **수집 단계**에서 실패했습니다(exit 1). 사이트에는 아무 영향이 없고, 이번 주 변경을 못 봤을 뿐입니다.'
            echo
            echo "- 실행 로그: $RUN_URL"
            echo
            echo '### 로그 마지막 40줄'
            echo
            echo '```'
            tail -n 40 watch.log 2>/dev/null || echo '(watch.log 없음 — 감시 스텝 전에 실패)'
            echo '```'
            echo
            echo '### 조치'
            echo
            echo '- `HTTP 403`·타임아웃이 계속되면 WAF 차단·호스트 이전을 의심한다(HEAD 요청은 원래 403이라 이 스크립트는 GET 만 쓴다).'
            echo '- `table.calendarTable 을 찾지 못했다`·`월 행이 하나도 없다`: 입학처 마크업이 바뀌었다. `tools/automation/admission-watch.mjs` 의 파서 주석(실측 구조)을 보고 선택자를 맞춘다.'
            echo '- 정상 복구 여부는 `workflow_dispatch` 에서 dry_run=true 로 한 번 돌려 확인한다.'
          } > fail-body.md
          TITLE="[자동] 입학처 감시 실패 ($(TZ=Asia/Seoul date +%Y-%m-%d))"
          if [ "$DRY_RUN" = "true" ]; then
            node tools/automation/issue.mjs --title "$TITLE" --body-file fail-body.md --label automation --dry-run
          else
            node tools/automation/issue.mjs --title "$TITLE" --body-file fail-body.md --label automation
          fi

      - name: 변경 없음
        if: steps.watch.outputs.code == '0'
        run: echo '입학처 신호 3종이 직전 스냅샷과 같습니다 — 변경 없음.' >> "$GITHUB_STEP_SUMMARY"

      # 0/10/1 이 아니면 계약이 깨진 것이다 — 조용히 초록불이 되지 않게 여기서 죽인다.
      - name: 알 수 없는 종료 코드
        if: steps.watch.outputs.code != '0' && steps.watch.outputs.code != '1' && steps.watch.outputs.code != '10'
        run: |
          echo "::error::admission-watch 가 예상 밖의 코드로 끝났다: ${{ steps.watch.outputs.code }}"
          exit 1

      # 이슈를 만든 뒤에 빨간불로 끝낸다 — 수집 실패가 초록불로 묻히지 않게.
      - name: 수집 실패로 종료
        if: steps.watch.outputs.code == '1'
        run: |
          echo '::error::입학처 수집에 실패했습니다 — 위 이슈를 확인할 것.'
          exit 1
