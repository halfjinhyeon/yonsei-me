# 교수 학술활동 자동 수집 — 교원정보시스템에서 받아 프로덕션 DB 에 **병합**한다.
#
# 왜 GitHub Actions 인가
#   교수 33명 × 6~11요청 × 300ms 지연이라 한 바퀴가 몇 분 걸린다. Vercel 서버리스
#   함수(Hobby 최대 60초)로는 끝까지 돌지 못해서 별도 러너가 필요하다.
#
# 안전장치
#   수집기는 **병합 전용**이다 — 기존 행을 지우거나 덮어쓰지 않고 없던 행만 붙인다.
#   그래서 자동 실행이 CMS 편집분·AI 요약·원본에서 밀려난 옛 실적을 훼손하지 않는다.
#
# 비밀값이 없으면 드라이런
#   SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY 를 저장소 Secrets 에 넣기 전까지는
#   기록하지 않고 "신규 몇 건"만 로그에 찍는다. 실제 반영을 원하면 두 값을 넣을 것.
#   ⚠️ 이 저장소는 Public 이다. 포크 PR 에는 비밀값이 전달되지 않지만, service-role
#   키를 넣는 결정 자체는 사람이 판단해야 한다.
#
# 실패 가시화 (2026-09 추가 — automation-spec.md 1절)
#   수집기는 한 교수의 요청이 전부 실패해도 건너뛰고 계속 가므로, 원본 마크업 변경·
#   차단(403)·호스트 이전 같은 **구조적 실패**가 나도 예전에는 초록불로 끝났다. 이제
#   `--fail-threshold=0.2`(전부 실패한 교수 5명 중 1명 이상)를 붙여 부르고, 초과하면
#   수집기가 exit 2 로 끝나 이 워크플로가 빨간불이 된다. 그때 `if: failure()` 스텝이
#   `crawl.log` 꼬리와 조치 안내를 담아 이슈(라벨 automation)를 만든다 — 같은 제목의
#   열린 이슈가 있으면 새로 만들지 않고 댓글로 붙는다(tools/automation/issue.mjs).
#   ⚠️ `tee` 가 파이프의 마지막 명령이라 `set -o pipefail` 이 없으면 수집기의 exit 2 가
#   삼켜져 실패 스텝이 아예 안 뜬다. 수집 스텝 첫 줄이 그래서 pipefail 이다.
#   시험 방법: workflow_dispatch 에서 simulate_failure=true(전 요청 1ms 타임아웃 →
#   전원 실패), dry_run=true(이슈 대신 step summary 출력)로 한 번 돌려 볼 것.
name: 교수 학술활동 수집

on:
  schedule:
    # 매월 2일 03:00 KST (= 매월 1일 18:00 UTC). 논문·과제는 학기 단위로 갱신되므로
    # 월 1회면 충분하고, 학교 서버에 부담도 거의 없다.
    - cron: '0 18 1 * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'DB 에 기록 (끄면 드라이런)'
        type: boolean
        default: true
      simulate_failure:
        description: '실패 경로 시험 — 전 요청 타임아웃 (기록하지 않음)'
        type: boolean
        default: false
      dry_run:
        description: '이슈를 만들지 않고 summary 에만'
        type: boolean
        default: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 최소 권한: 코드 읽기 + 실패 이슈 쓰기.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # supabase-js 한 개만 있으면 되지만, lockfile 재현성을 위해 통째로 설치한다.
      - run: npm ci
      - name: 수집·병합
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APPLY_INPUT: ${{ inputs.apply }}
          SIMULATE_FAILURE: ${{ inputs.simulate_failure }}
        run: |
          set -o pipefail   # tee 가 수집기의 exit 2 를 삼키지 않도록 — 첫 줄이어야 한다
          GATE=--fail-threshold=0.2
          if [ "$SIMULATE_FAILURE" = "true" ]; then
            # 실패 경로 시험. --apply 를 빼고 --source 도 주지 않아 어디에도 기록하지 않는다.
            echo "::warning::simulate_failure=true — 전 요청을 1ms 타임아웃으로 실패시킵니다(기록 안 함)."
            node tools/crawl-faculty-profiles.mjs --timeout-ms=1 "$GATE" 2>&1 | tee crawl.log
          elif [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::Supabase 비밀값이 없어 드라이런으로 돕니다."
            node tools/crawl-faculty-profiles.mjs "$GATE" 2>&1 | tee crawl.log
          elif [ "$APPLY_INPUT" = "false" ]; then
            node tools/crawl-faculty-profiles.mjs --source=db "$GATE" 2>&1 | tee crawl.log
          else
            node tools/crawl-faculty-profiles.mjs --source=db --apply "$GATE" 2>&1 | tee crawl.log
          fi
      - name: 실패 이슈
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # boolean 입력은 workflow_dispatch 에서만 진짜 boolean 이고 schedule 실행에서는
          # null 이다. GitHub 식 비교는 타입이 다르면 숫자로 캐스팅하므로(null→0, true→1)
          # `inputs.dry_run == true` 는 스케줄 실행에서 자연히 false 가 된다 — 즉 스케줄
          # 실패는 항상 실제 이슈, 손으로 돌린 시험만 dry-run 이 될 수 있다.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: |
          set -o pipefail
          {
            echo "교수 학술활동 수집이 실패했습니다(수집기 exit 2 = 전부 실패 비율이 임계 초과)."
            echo
            echo "- 실행 로그: $RUN_URL"
            echo
            echo '### 수집 로그 마지막 60줄'
            echo
            echo '```'
            tail -n 60 crawl.log 2>/dev/null || echo '(crawl.log 없음 — 수집 스텝 전에 실패)'
            echo '```'
            echo
            echo '### 조치'
            echo
            echo '- 원본 마크업이 바뀐 경우: `src/lib/faculty-crawl/core.ts` 파서의 실측 주석을 보고 선택자를 맞춘다(이 파일은 CMS 의 "실적 불러오기"와 공유하므로 행 키 순서 계약에 주의).'
            echo '- HTTP 403·타임아웃이 다발한 경우: 요청 지연을 올리고 차단 여부(WAF·호스트 이전)를 확인한다.'
          } > issue-body.md
          TITLE="[자동] 교수 학술활동 수집 실패 ($(TZ=Asia/Seoul date +%Y-%m-%d))"
          if [ "$DRY_RUN" = "true" ]; then
            node tools/automation/issue.mjs --title "$TITLE" --body-file issue-body.md --label automation --dry-run
          else
            node tools/automation/issue.mjs --title "$TITLE" --body-file issue-body.md --label automation
          fi
