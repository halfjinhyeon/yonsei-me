<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" role="img" aria-label="">
  <!-- 히어로 배경 플레이스홀더 (블루프린트 모티프). 실제 캠퍼스/연구 사진으로 교체 권장: public/img/hero.jpg -->
  <defs>
    <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001b40"/>
      <stop offset="0.55" stop-color="#00285E"/>
      <stop offset="1" stop-color="#003b86"/>
    </linearGradient>
    <radialGradient id="hglow" cx="0.2" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#2E86D6" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#0057A8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#00285E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#hg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#hglow)"/>
  <!-- 기어/궤적 라인 모티프 -->
  <g stroke="#8fc0f0" stroke-opacity="0.25" fill="none" stroke-width="1.5">
    <circle cx="1250" cy="620" r="180"/>
    <circle cx="1250" cy="620" r="120"/>
    <circle cx="1250" cy="620" r="60"/>
    <path d="M1070 620 H1430 M1250 440 V800"/>
  </g>
  <g stroke="#C8A96A" stroke-opacity="0.35" fill="none" stroke-width="1.5">
    <path d="M-50 760 Q400 620 800 720 T1650 640"/>
    <path d="M-50 820 Q400 700 800 790 T1650 720"/>
  </g>
